name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS/toolchain instead of cancelling the rest on one failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.70.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cargo.lock is not committed. Resolve with stable Cargo's MSRV-aware
      # resolver so dev-dependencies stay compatible with rust-version.
      - name: Generate lockfile
        run: cargo +stable generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      # Tests create their fixture repositories with Git on first use.
      - name: Build
        run: cargo +${{ matrix.rust }} build --verbose
      - name: Run tests
        run: cargo +${{ matrix.rust }} test --verbose
      # Runners use UTC; check the local time zone handling (with daylight
      # saving time) against Git as well.
      - name: Run commit tests in another time zone
        if: runner.os != 'Windows'
        run: cargo +${{ matrix.rust }} test --test commit_test
        env:
          TZ: America/New_York

  remote:
    # zerogit-remote is a separate crate (its own workspace) with network
    # dependencies, so it builds on stable only.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: zerogit-remote
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  ssh:
    # The SSH transport against a real sshd on localhost (tests/ssh_test.rs
    # in zerogit-remote, ignored elsewhere). A separate job, so a missing
    # server is a visible failure here rather than a silent skip.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zerogit-remote
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Start sshd and configure the client
        run: |
          set -eux
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server
          sudo mkdir -p /run/sshd
          # The runner account has a locked password, which sshd treats as a
          # locked account (without PAM) even for key logins. "*" means "no
          # password" instead.
          sudo usermod -p '*' "$USER"
          dir="$HOME/sshd"
          mkdir -p "$dir" ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f "$dir/host_key"
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/zerogit_test
          cat ~/.ssh/zerogit_test.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          cat > "$dir/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $dir/host_key
          PidFile $dir/sshd.pid
          AuthorizedKeysFile $HOME/.ssh/authorized_keys
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          StrictModes no
          UsePAM no
          AcceptEnv GIT_PROTOCOL
          EOF
          sudo /usr/sbin/sshd -f "$dir/sshd_config" -E "$dir/sshd.log"
          echo "zerogit-test-host $(cut -d' ' -f1,2 "$dir/host_key.pub")" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host zerogit-test localhost
            HostName 127.0.0.1
            Port 2222
            User $USER
            IdentityFile ~/.ssh/zerogit_test
            IdentitiesOnly yes
            HostKeyAlias zerogit-test-host
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF
          ssh zerogit-test true
          echo "ZEROGIT_SSH_HOST=zerogit-test" >> "$GITHUB_ENV"
          echo "ZEROGIT_SSH_USER=$USER" >> "$GITHUB_ENV"
          echo "ZEROGIT_SSH_PORT=2222" >> "$GITHUB_ENV"
      - name: Run SSH tests
        run: cargo test --test ssh_test -- --ignored
      - name: Show the sshd log
        if: failure()
        run: sudo cat "$HOME/sshd/sshd.log"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
