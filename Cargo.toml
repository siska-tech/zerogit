[package]
name = "zerogit"
version = "0.8.0"
edition = "2021"
rust-version = "1.70"
description = "A lightweight, pure Rust Git client library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/siska-tech/zerogit"
readme = "README.md"
keywords = ["git", "vcs", "pure-rust"]
categories = ["development-tools"]
# Planning notes, design documents and the test suite are for development only.
exclude = ["issues/", "docs/", "tests/", ".cargo/", "zerogit-remote/"]

[dependencies]
miniz_oxide = "0.8"

[dev-dependencies]
tempfile = "3"
